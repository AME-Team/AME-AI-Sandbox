---
# AME AI Review System — インライン返信に対する LGTM/追加指摘判断のラッパ (配布先用)。
# `ame-ai-reviewer init` で生成される。v0.2.7 はリリースタグ (例: v1.0.0) に置換される。
# secrets 登録のエンジン情報 (Issue #40) も引き継ぐ。
#
# bot 自己除外 (`comment_user != 'ame-ai-reviewer[bot]'`) と `/` コマンド除外
# (`!startsWith(comment_body, '/')`) は、このラッパではなく reusable workflow
# (AME-Team/AME-AI-Review-System/.github/workflows/review-reply.yml@v0.2.7) 側で
# `comment_user` / `comment_body` 入力として受けて実施する（返信カスケード防止）。

name: AI Review Reply

"on":
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# Issue #68: インラインコメントは複数連続で投稿され得るため、同一 PR の reply
# workflow をグループ化して並列実行・履歴ノイズを抑える（cancel はせず完了させる）。
concurrency:
  group: review-reply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reply:
    # 前置フィルタ: reusable workflow 側の自己除外・コマンド除外と二重化する防御。
    # bot 自身の返信や `/` コマンドによる発火をコストゼロで抑える。
    # 片方を変更した場合は reusable workflow のフィルタと同期して更新すること。
    if: >-
      github.event.comment.user.login != 'ame-ai-reviewer[bot]' &&
      !startsWith(github.event.comment.body, '/')
    uses: AME-Team/AME-AI-Review-System/.github/workflows/review-reply.yml@v0.2.7
    with:
      pr_number: ${{ github.event.pull_request.number }}
      comment_id: ${{ github.event.comment.id }}
      comment_body: ${{ github.event.comment.body }}
      comment_user: ${{ github.event.comment.user.login }}
      system_ref: v0.2.7
      review_engine: ${{ vars.REVIEW_ENGINE || '' }}
      review_model: ${{ vars.REVIEW_MODEL || '' }}
      reply_model: ${{ vars.REPLY_MODEL || '' }}
      review_thinking: ${{ vars.REVIEW_THINKING || '' }}
    secrets:
      app-id: ${{ secrets.AME_AI_REVIEWER_APP_ID }}
      private-key: ${{ secrets.AME_AI_REVIEWER_APP_PRIVATE_KEY }}
      opencode-auth-b64: ${{ secrets.OPENCODE_AUTH_B64 }}
      antigravity-oauth-b64: ${{ secrets.ANTIGRAVITY_OAUTH_B64 }}
      gemini-oauth-b64: ${{ secrets.GEMINI_OAUTH_B64 }}
      review-engine: ${{ secrets.REVIEW_ENGINE }}
      review-model: ${{ secrets.REVIEW_MODEL }}
      reply-model: ${{ secrets.REPLY_MODEL }}
      review-thinking: ${{ secrets.REVIEW_THINKING }}
