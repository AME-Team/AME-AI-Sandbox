---
# AME AI Review System — pre-commit profile: python
# Python 静的解析 (ruff/mypy/codespell) + AI レビューフック。
minimum_pre_commit_version: "4.0.0"
# Issue #82: ai-review-state-reset (stages: [post-commit]) が standard install で
# 入るよう post-commit を明示する。既存クローンで pre-commit install 済みの場合は
#   pre-commit install -t pre-commit -t post-commit
# を再実行すること。
default_install_hook_types: [pre-commit, post-commit]
# ローカル git merge 時にもゲートを掛ける（旧設定からの継続。統合は GitHub PR ベースが主）。
default_stages: [pre-commit, pre-merge-commit]
fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: []

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell

  # =========================================================================
  # AME-AI-Sandbox 固有フック（Dockerfile / entrypoint.sh / compose.yaml 向け）。
  # init の python プリセットには含まれないため、AI レビューより先に実行する
  # （Circuit Breaker: 機械的指摘は LLM 呼び出し前に検出する）。
  # ツールはホスト・CI にグローバル導入済み（shellcheck / hadolint / trivy / yamllint）。
  # =========================================================================
  - repo: local
    hooks:
      - id: shellcheck
        name: "shellcheck (shell script linter)"
        entry: shellcheck --external-sources --severity=style --rcfile=.shellcheckrc
        language: system
        types: [shell]
        pass_filenames: true

      - id: hadolint
        name: "hadolint (Dockerfile lint, strict)"
        entry: hadolint --failure-threshold info
        language: system
        files: (^|/)Dockerfile(\..*)?$
        pass_filenames: true

      - id: trivy-config
        name: "trivy config (Dockerfile misconfiguration + secret scan, strict)"
        entry: trivy config --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        language: system
        files: (^|/)Dockerfile(\..*)?$
        pass_filenames: true

      - id: yamllint
        name: "yamllint (strict)"
        entry: yamllint --strict
        language: system
        types: [yaml]
        pass_filenames: true

      - id: gitleaks
        name: "gitleaks (secret scanner)"
        entry: gitleaks protect --staged
        language: system
        pass_filenames: false

      - id: detect-private-key
        name: "detect private key"
        entry: detect-private-key
        language: system
        types: [text]
        pass_filenames: true

  # =========================================================================
  # AME AI Review System — Gate 1 AI review hooks
  # pre-commit が `language: python` の venv へ wheel を自動導入するため、
  # 絶対パスのハードコードは不要 (各環境で解決される)。初回実行時のみ
  # GitHub Releases の wheel 取得にネットワークが必要 (以降はキャッシュ)。
  # オフライン/制限環境では `ame-ai-reviewer init --python <path>` を使うと
  # `language: system` で生成され、事前に導入した Python で実行される。
  # 供給チェーン対策として wheel は `#sha256=` で内容を固定する (Issue #84)。
  # 各フックの additional_dependencies は常に同一に保つこと (init 生成時は単一の
  # 定義から全フックへ一律展開される。手動編集時は 3 フックすべてを揃えること)。
  # =========================================================================
  - repo: local
    hooks:
      - id: ai-skip-guard
        name: "AI review skip guard (Issue #26)"
        entry: python -m ame_ai_review_system.skip_guard
        language: python
        additional_dependencies:
          - ame_ai_review_system @ https://github.com/AME-Team/AME-AI-Review-System/releases/download/v0.2.7/ame_ai_review_system-0.2.7-py3-none-any.whl#sha256=69364c9c5d28c15d0cfb3f9fab7bde607bfbb32dfb8b491069ddb24c1df5b4bc
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-precommit-review
        name: "AI Code Review (pre-commit)"
        entry: python -m ame_ai_review_system.precommit_review
        language: python
        additional_dependencies:
          - ame_ai_review_system @ https://github.com/AME-Team/AME-AI-Review-System/releases/download/v0.2.7/ame_ai_review_system-0.2.7-py3-none-any.whl#sha256=69364c9c5d28c15d0cfb3f9fab7bde607bfbb32dfb8b491069ddb24c1df5b4bc
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-review-state-reset
        name: "AI review state reset (post-commit)"
        entry: python -m ame_ai_review_system.post_commit_reset
        language: python
        additional_dependencies:
          - ame_ai_review_system @ https://github.com/AME-Team/AME-AI-Review-System/releases/download/v0.2.7/ame_ai_review_system-0.2.7-py3-none-any.whl#sha256=69364c9c5d28c15d0cfb3f9fab7bde607bfbb32dfb8b491069ddb24c1df5b4bc
        pass_filenames: false
        always_run: true
        stages: [post-commit]
